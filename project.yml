name: Afterimage
options:
  bundleIdPrefix: com.leohanon
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    DEVELOPMENT_TEAM: 7BR5ZAMV2Z
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "4"
    ENABLE_HARDENED_RUNTIME: YES
targets:
  Afterimage:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
    dependencies:
      - target: AfterimageExtension
        embed: true
        codeSign: true
        copy:
          destination: plugins
          subpath: ../Library/SystemExtensions
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leohanon.Afterimage
        CODE_SIGN_ENTITLEMENTS: App/Afterimage.entitlements
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Afterimage uses your webcam for the live feed and to record your daily loop.
        INFOPLIST_KEY_CFBundleDisplayName: Afterimage
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.video
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright © 2026 Leonardo Hanon. MIT License.
  AfterimageExtension:
    type: system-extension
    platform: macOS
    sources:
      - Extension
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leohanon.Afterimage.Extension
        PRODUCT_NAME: com.leohanon.Afterimage.Extension
        INFOPLIST_FILE: Extension/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extension/Extension.entitlements
        SKIP_INSTALL: YES
