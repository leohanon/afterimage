<!doctype html>
<html><head><meta charset="utf-8"><title>Menu bar click</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1440px; height: 900px; overflow: hidden; }
  body {
    font-family: -apple-system, "SF Pro Display", sans-serif;
    color: #2a1d18;
    background: linear-gradient(160deg, #fbeee8 0%, #f6d5c6 100%);
    position: relative;
  }
  .slide { position: absolute; inset: 0; display: none; }
  .slide.on { display: block; }
  h1 { font-size: 68px; line-height: 1.05; letter-spacing: -0.03em; font-weight: 700; }
  p.sub { font-size: 26px; line-height: 1.4; color: #6f4a3c; margin-top: 20px; }
  .text { position: absolute; left: 96px; top: 250px; width: 520px; }
  .text.top { top: 0; left: 0; right: 0; width: auto; text-align: center; padding-top: 72px; }
  .accent { color: #d85a30; }

  /* menu bar + menu mock */
  .menubar {
    position: absolute; top: 0; left: 0; right: 0; height: 34px;
    background: rgba(255,255,255,.55); backdrop-filter: blur(20px);
    display: flex; justify-content: flex-end; align-items: center; gap: 22px; padding: 0 22px;
    font-size: 15px; font-weight: 500;
  }
  .menubar .glyph { width: 20px; height: 20px; display: block; }
  .menubar .sel { background: rgba(0,0,0,.12); border-radius: 6px; padding: 4px 8px; display: flex; }
  .menu {
    position: absolute; top: 40px; right: 150px; width: 340px;
    background: rgba(246,243,241,.92); backdrop-filter: blur(30px);
    border-radius: 12px; padding: 6px; font-size: 15px;
    box-shadow: 0 0 0 .5px rgba(0,0,0,.18), 0 18px 50px rgba(80,30,10,.25);
  }
  .item { padding: 5px 12px 5px 28px; border-radius: 6px; position: relative; display: flex; justify-content: space-between; }
  .item.dim { color: #8a7f7a; }
  .item.hi { background: #d85a30; color: #fff; }
  .item .check { position: absolute; left: 10px; }
  .item .key { color: #8a7f7a; }
  .item.hi .key { color: #fff; }
  .sep { height: 1px; background: rgba(0,0,0,.1); margin: 5px 12px; }

  /* call window mock */
  .call {
    position: absolute; left: 700px; top: 250px; width: 640px; height: 420px;
    border-radius: 16px; background: #1f1f22; overflow: hidden;
    box-shadow: 0 30px 80px rgba(80,30,10,.3);
  }
  .call .bar { height: 36px; background: #2b2b2f; display: flex; align-items: center; gap: 8px; padding: 0 14px; }
  .call .bar i { width: 12px; height: 12px; border-radius: 50%; background: #555; display: block; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 14px; height: calc(100% - 36px - 64px); }
  .tile { border-radius: 10px; position: relative; overflow: hidden; }
  .tile .name { position: absolute; left: 10px; bottom: 8px; color: #fff; font-size: 13px; background: rgba(0,0,0,.45); padding: 2px 8px; border-radius: 5px; }
  .tile .person { position: absolute; left: 50%; bottom: -10px; transform: translateX(-50%); width: 140px; height: 170px; }
  .tile .person .head { width: 76px; height: 76px; border-radius: 50%; margin: 0 auto; }
  .tile .person .body { width: 140px; height: 90px; border-radius: 70px 70px 0 0; margin-top: 8px; }
  .t1 { background: linear-gradient(#4b5f73, #2e3d4c); } .t1 .head { background: #e8c1a5; } .t1 .body { background: #2f6fa3; }
  .t2 { background: linear-gradient(#7a5a48, #4c3529); } .t2 .head { background: #c99474; } .t2 .body { background: #d85a30; }
  .t2::after { content: ""; position: absolute; inset: 0; border: 3px solid #d85a30; border-radius: 10px; }
  .loopbadge { position: absolute; right: 10px; top: 10px; background: #d85a30; color: #fff; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 20px; display: flex; gap: 6px; align-items: center; }
  .loopbadge img { width: 13px; height: 13px; filter: invert(1); }
  .controls { height: 64px; display: flex; justify-content: center; align-items: center; gap: 14px; }
  .controls b { width: 40px; height: 40px; border-radius: 50%; background: #3a3a3f; display: block; }
  .controls b.end { background: #e0443e; width: 56px; border-radius: 20px; }

  .pick {
    position: absolute; left: 1040px; top: 170px; width: 300px;
    background: #fff; border-radius: 10px; padding: 6px; font-size: 15px;
    box-shadow: 0 0 0 .5px rgba(0,0,0,.2), 0 14px 40px rgba(0,0,0,.25);
  }
  .pick .h { font-size: 12px; color: #8a7f7a; padding: 4px 10px; font-weight: 600; }

  .window {
    position: absolute; border-radius: 14px; overflow: hidden; background: #ededed;
    box-shadow: 0 0 0 .5px rgba(0,0,0,.2), 0 30px 80px rgba(80,30,10,.3);
  }
  .window .tb { height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 12px; position: relative; font-size: 13px; font-weight: 600; color: #555; }
  .window .tb i { width: 12px; height: 12px; border-radius: 50%; display: block; }
  .window .tb .t { position: absolute; left: 0; right: 0; text-align: center; }
  .window img { display: block; width: 600px; }

  .bigicon { width: 220px; height: 220px; }
  .points { display: flex; gap: 28px; justify-content: center; margin-top: 70px; }
  .point { width: 340px; background: rgba(255,255,255,.7); border-radius: 18px; padding: 30px; text-align: left; }
  .point h3 { font-size: 24px; margin-bottom: 10px; }
  .point p { font-size: 18px; line-height: 1.45; color: #6f4a3c; }
</style>
<style>
  html, body { width: 720px; height: 480px; }
  .menubar { justify-content: flex-end; }
  .menu { right: 70px; }
  .cursor { position: absolute; top: 16px; right: 114px; width: 26px; height: 38px; z-index: 5; }
</style></head>
<body>
<div class="menubar">
  <span>Wi‑Fi</span><span>100%</span>
  <span class="sel"><img class="glyph" src="glyph.png" alt=""></span>
  <span>Thu 9:41 AM</span>
</div>
<svg class="cursor" viewBox="0 0 26 38"><path d="M2 2 L2 30 L9 23 L14 35 L19 33 L14 21 L23 21 Z" fill="#000" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>
<div class="menu">
  <div class="item dim">Not in use</div>
  <div class="sep"></div>
  <div class="item"><span class="check">✓</span>Live</div>
  <div class="item">Loop</div>
  <div class="sep"></div>
  <div class="item hi">Record Loop</div>
  <div class="item dim">No loop recorded yet</div>
  <div class="sep"></div>
  <div class="item">Webcam<span class="key">›</span></div>
  <div class="item"><span class="check">✓</span>Open at Login</div>
  <div class="item">Settings…<span class="key">⌘,</span></div>
  <div class="item">Quit Afterimage<span class="key">⌘Q</span></div>
</div>
</body></html>
